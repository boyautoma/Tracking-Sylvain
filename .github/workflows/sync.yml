name: Sync Dashboard Data

on:
  schedule:
    - cron: '23 6 * * *'
    - cron: '47 18 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync VividCraft (Shopify + Meta)
        run: node scripts/sync.cjs
        env:
          SHOPIFY_TOKEN: ${{ secrets.SHOPIFY_TOKEN }}
          SHOPIFY_DOMAIN: ${{ secrets.SHOPIFY_DOMAIN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}

      - name: Sync Lymphlite (Shopify + Meta)
        run: node scripts/sync-lymphlite.cjs
        env:
          LYMPHLITE_SHOPIFY_TOKEN: ${{ secrets.LYMPHLITE_SHOPIFY_TOKEN }}
          LYMPHLITE_SHOPIFY_DOMAIN: ${{ secrets.LYMPHLITE_SHOPIFY_DOMAIN }}
          LYMPHLITE_META_ACCESS_TOKEN: ${{ secrets.LYMPHLITE_META_ACCESS_TOKEN }}
          LYMPHLITE_META_AD_ACCOUNT_ID: ${{ secrets.LYMPHLITE_META_AD_ACCOUNT_ID }}

      - name: Commit and push data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'auto-sync dashboard data'
          file_pattern: 'data.json lymphlite-data.json'
