<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VividCraft — P&L Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--coral:#E87461;--teal:#2BAA94;--peach:#F5B88C;--dark:#1a1a2e;--dark2:#16213e;--dark3:#1e2a4a;--white:#f0f0f0;--red:#ff6b6b;--green:#51cf66;--muted:#8892a4;--dimmed:#5a6478}
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(135deg,var(--dark) 0%,#0f1628 100%);color:var(--white);font-family:'Inter',-apple-system,sans-serif;min-height:100vh;padding:24px 20px}
.header h1{font-size:26px;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px}
.coral{color:var(--coral)}.teal{color:var(--teal)}
.sub{color:var(--muted);font-weight:400;font-size:16px;margin-left:10px}
.meta-info{font-size:11px;color:var(--dimmed);font-family:'JetBrains Mono',monospace;margin-bottom:24px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{background:transparent;color:var(--muted);border:1px solid var(--dark3);border-radius:8px;padding:9px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.tab.active{background:var(--teal);color:var(--dark);border-color:var(--teal)}
.date-bar{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.date-bar label{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px}
.date-bar input[type="date"]{background:var(--dark2);color:var(--white);border:1px solid var(--dark3);border-radius:8px;padding:8px 14px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;outline:none}
.date-bar input[type="date"]:focus{border-color:var(--teal)}
.date-bar input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.7);cursor:pointer}
.sep{color:var(--dimmed);font-size:14px}
.quick-btns{display:flex;gap:6px;margin-left:8px}
.quick-btn{background:transparent;color:var(--dimmed);border:1px solid var(--dark3);border-radius:6px;padding:6px 12px;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'JetBrains Mono',monospace}
.quick-btn:hover,.quick-btn.active{background:var(--teal);color:var(--dark);border-color:var(--teal)}
.kpi-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.kpi{background:var(--dark2);border-radius:12px;padding:20px 24px;border:1px solid var(--dark3);min-width:150px;flex:1}
.kpi.sm{padding:14px 16px;min-width:120px}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.kpi-value{font-size:28px;font-weight:700;font-family:'Space Mono',monospace}
.kpi.sm .kpi-value{font-size:20px}
.tbl-box{background:var(--dark2);border-radius:12px;padding:20px 16px;border:1px solid var(--dark3);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 12px;text-align:right;color:var(--dimmed);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--dark3)}
td{padding:10px 12px;text-align:right}
tr.total-row{border-top:2px solid rgba(43,170,148,.27)}
tr.total-row td{padding:12px;font-weight:700}
.footer{text-align:center;margin-top:24px;font-size:11px;color:#3a4458;font-family:'JetBrains Mono',monospace}
.settings-section{background:var(--dark2);border-radius:12px;padding:24px;border:1px solid var(--dark3);margin-bottom:16px}
.settings-section h3{font-size:14px;font-weight:700;margin-bottom:16px;color:var(--peach);text-transform:uppercase;letter-spacing:1px;font-family:'JetBrains Mono',monospace}
.settings-table{width:100%;border-collapse:collapse}
.settings-table th{text-align:left;padding:8px 12px;color:var(--dimmed);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--dark3)}
.settings-table td{padding:8px 12px;border-bottom:1px solid var(--dark3)}
.settings-table td:first-child{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--teal)}
.settings-table td:nth-child(2){color:var(--muted);font-size:12px}
.settings-table input{background:var(--dark);color:var(--white);border:1px solid var(--dark3);border-radius:6px;padding:6px 10px;font-size:13px;font-family:'Space Mono',monospace;width:90px;text-align:right;outline:none}
.settings-table input:focus{border-color:var(--teal)}
.btn-save{background:var(--teal);color:var(--dark);border:none;border-radius:8px;padding:10px 24px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:12px}
.btn-save:hover{opacity:.85}
.save-msg{color:var(--green);font-size:12px;margin-left:12px;font-family:'JetBrains Mono',monospace;opacity:0;transition:opacity .3s}
.save-msg.show{opacity:1}
@media(max-width:600px){.kpi{min-width:calc(50% - 8px);padding:14px 16px}.kpi-value{font-size:20px}.kpi.sm{min-width:calc(50% - 8px)}.kpi.sm .kpi-value{font-size:16px}body{padding:16px 12px}.quick-btns{margin-left:0;margin-top:4px}}
</style>
</head>
<body>
<div class="header">
<h1><span class="coral">Vivid</span><span class="teal">Craft</span><span class="sub">P&L</span></h1>
</div>
<div class="meta-info" id="metaInfo"></div>
<div class="tabs">
<button class="tab active" data-tab="kpis">KPIs</button>
<button class="tab" data-tab="breakdown">Breakdown</button>
<button class="tab" data-tab="settings">Param&egrave;tres</button>
</div>
<div id="dateBar" class="date-bar">
<label>Du</label><input type="date" id="dateFrom">
<span class="sep">&rarr;</span>
<label>Au</label><input type="date" id="dateTo">
<div class="quick-btns">
<button class="quick-btn" data-range="3">3J</button>
<button class="quick-btn" data-range="7">7J</button>
<button class="quick-btn active" data-range="all">Tout</button>
</div>
</div>
<div id="content"></div>
<div class="footer">Mis &agrave; jour par Claude</div>

<script>
const DAILY=[
{date:"2026-03-28",label:"03/28",orders:1,revenue:5.69,spend:0,solo:{"VIVIDCRAFT_ACRYLICMARKER_72COLORS":1},upsell:{"VC_FREESHIP":1,"VC_MIXGUIDE":1}},
{date:"2026-03-29",label:"03/29",orders:5,revenue:268.97,spend:134.05,solo:{"VIVIDCRAFT_ACRYLICMARKER_72COLORS":3,"VIVIDCRAFT_ACRYLICMARKER_168COLORS":1,"VIVIDCRAFT_ACRYLICMARKER_24COLORS":1},upsell:{"VC_FREESHIP":3,"VC_MIXGUIDE":4,"VC_EBOOK":1}},
{date:"2026-03-30",label:"03/30",orders:2,revenue:81.50,spend:179.62,solo:{"VIVIDCRAFT_ACRYLICMARKER_24COLORS":1,"VIVIDCRAFT_ACRYLICMARKER_72COLORS":1},upsell:{"VC_MIXGUIDE":2,"VC_FREESHIP":1}},
{date:"2026-03-31",label:"03/31",orders:1,revenue:49.50,spend:197.14,solo:{"VIVIDCRAFT_ACRYLICMARKER_72COLORS":1},upsell:{"VC_FREESHIP":1,"VC_MIXGUIDE":1}},
{date:"2026-04-01",label:"04/01",orders:5,revenue:341.96,spend:141.70,solo:{"VIVIDCRAFT_ACRYLICMARKER_72COLORS":2,"VIVIDCRAFT_ACRYLICMARKER_168COLORS":3},upsell:{"VC_FREESHIP":5,"VC_MIXGUIDE":5,"VC_EBOOK":3}},
{date:"2026-04-02",label:"04/02",orders:2,revenue:69.98,spend:167.43,solo:{"VIVIDCRAFT_ACRYLICMARKER_24COLORS":2},upsell:{"VC_MIXGUIDE":2}},
{date:"2026-04-03",label:"04/03",orders:8,revenue:418.96,spend:207.61,solo:{"VIVIDCRAFT_ACRYLICMARKER_24COLORS":3,"VIVIDCRAFT_ACRYLICMARKER_168COLORS":3,"VIVIDCRAFT_ACRYLICMARKER_72COLORS":2},upsell:{"VC_MIXGUIDE":8,"VC_EBOOK":3,"VC_FREESHIP":5}},
{date:"2026-04-04",label:"04/04",orders:9,revenue:519.45,spend:197.57,solo:{"VIVIDCRAFT_ACRYLICMARKER_168COLORS":4,"VIVIDCRAFT_ACRYLICMARKER_72COLORS":3,"VIVIDCRAFT_ACRYLICMARKER_24COLORS":2},upsell:{"VC_EBOOK":4,"VC_FREESHIP":7,"VC_MIXGUIDE":9}},
{date:"2026-04-05",label:"04/05",orders:5,revenue:313.46,spend:284.27,solo:{"VIVIDCRAFT_ACRYLICMARKER_168COLORS":3,"VIVIDCRAFT_ACRYLICMARKER_72COLORS":1,"VIVIDCRAFT_ACRYLICMARKER_24COLORS":1},upsell:{"VC_EBOOK":3,"VC_MIXGUIDE":5,"VC_FREESHIP":4}},
{date:"2026-04-06",label:"04/06",orders:7,revenue:438.97,spend:199.77,solo:{"VIVIDCRAFT_ACRYLICMARKER_72COLORS":2,"VIVIDCRAFT_ACRYLICMARKER_168COLORS":4,"VIVIDCRAFT_ACRYLICMARKER_24COLORS":1},upsell:{"VC_MIXGUIDE":6,"VC_EBOOK":4,"VC_FREESHIP":1}},
{date:"2026-04-07",label:"04/07",orders:6,revenue:420.96,spend:304.73,solo:{"VIVIDCRAFT_ACRYLICMARKER_168COLORS":4,"VIVIDCRAFT_ACRYLICMARKER_72COLORS":1,"VIVIDCRAFT_ACRYLICMARKER_24COLORS":1},upsell:{"VC_EBOOK":4,"VC_MIXGUIDE":5,"VC_COLORBOOK_JAPAN":1}},
{date:"2026-04-08",label:"04/08",orders:7,revenue:496.45,spend:236.62,solo:{"VIVIDCRAFT_ACRYLICMARKER_72COLORS":1,"VIVIDCRAFT_ACRYLICMARKER_24COLORS":1,"VIVIDCRAFT_ACRYLICMARKER_168COLORS":5},upsell:{"VC_MIXGUIDE":6,"VC_EBOOK":5,"VC_ARTBOOK_STEPBYSTEP":1}},
{date:"2026-04-09",label:"04/09",orders:1,revenue:54.99,spend:140.58,solo:{"VIVIDCRAFT_ACRYLICMARKER_72COLORS":1},upsell:{"VC_MIXGUIDE":1}},
{date:"2026-04-10",label:"04/10",orders:16,revenue:1004.33,spend:271.73,solo:{"VIVIDCRAFT_ACRYLICMARKER_72COLORS":8,"VIVIDCRAFT_ACRYLICMARKER_168COLORS":5,"VIVIDCRAFT_ACRYLICMARKER_24COLORS":3},upsell:{"VC_MIXGUIDE":12,"VC_EBOOK":4,"VC_COLORBOOK_CORNERS":1,"VC_ARTBOOK_STEPBYSTEP":1}},
{date:"2026-04-11",label:"04/11",orders:1,revenue:54.49,spend:0,solo:{"VIVIDCRAFT_ACRYLICMARKER_72COLORS":1},upsell:{"VC_MIXGUIDE":1}}
];

const ALL_SKUS=[
{sku:"VIVIDCRAFT_ACRYLICMARKER_24COLORS",name:"Acrylic Markers 24 Colors",defaultSolo:0,defaultUpsell:0},
{sku:"VIVIDCRAFT_ACRYLICMARKER_72COLORS",name:"Acrylic Markers 72 Colors",defaultSolo:0,defaultUpsell:0},
{sku:"VIVIDCRAFT_ACRYLICMARKER_168COLORS",name:"Acrylic Markers 168 Colors",defaultSolo:0,defaultUpsell:0},
{sku:"VC_GLITTERMARKER_24",name:"Glitter Markers 24 Colors",defaultSolo:0,defaultUpsell:0},
{sku:"VC_GLITTERMARKER_48",name:"Glitter Markers 48 Colors",defaultSolo:0,defaultUpsell:0},
{sku:"VC_GLITTERMARKER_96",name:"Glitter Markers 96 Colors",defaultSolo:0,defaultUpsell:0},
{sku:"VC_EBOOK",name:"Coloring eBook (digital)",defaultSolo:0,defaultUpsell:0},
{sku:"VC_MIXGUIDE",name:"Digital Color Mixing Guide",defaultSolo:0,defaultUpsell:0},
{sku:"VC_FREESHIP",name:"Free Shipping",defaultSolo:0,defaultUpsell:0},
{sku:"VC_COLORBOOK_JAPAN",name:"Cozy Japan Coloring Book",defaultSolo:0,defaultUpsell:0},
{sku:"VC_COLORBOOK_CORNERS",name:"Little Corners Coloring Book",defaultSolo:0,defaultUpsell:0},
{sku:"VC_ARTBOOK_STEPBYSTEP",name:"Step-by-Step Art Book",defaultSolo:0,defaultUpsell:0}
];

const LAST_UPDATED="2026-04-11";
const LS_KEY="vividcraft_sku_costs_v2";

function loadCosts(){
  try{const s=localStorage.getItem(LS_KEY);if(s)return JSON.parse(s)}catch(e){}
  const d={};ALL_SKUS.forEach(s=>d[s.sku]={solo:s.defaultSolo,upsell:s.defaultUpsell});return d;
}
function saveCosts(costs){localStorage.setItem(LS_KEY,JSON.stringify(costs))}
let skuCosts=loadCosts();

function calcCOGS(solo,upsell){
  let total=0;
  for(const[sku,qty]of Object.entries(solo)){
    const c=skuCosts[sku]||{solo:0};
    total+=qty*(c.solo||0);
  }
  for(const[sku,qty]of Object.entries(upsell)){
    const c=skuCosts[sku]||{upsell:0};
    total+=qty*(c.upsell||0);
  }
  return total;
}

let currentTab="kpis";
const dateFrom=document.getElementById("dateFrom"),dateTo=document.getElementById("dateTo");
dateFrom.value=DAILY[0].date;dateTo.value=DAILY[DAILY.length-1].date;
dateFrom.min=DAILY[0].date;dateFrom.max=DAILY[DAILY.length-1].date;
dateTo.min=DAILY[0].date;dateTo.max=DAILY[DAILY.length-1].date;
document.getElementById("metaInfo").textContent="Derni\u00e8re MAJ: "+new Date(LAST_UPDATED).toLocaleDateString("fr-FR");

function fmt(n,p="$"){if(n==null)return"\u2014";const a=Math.abs(n);const f=a>=1000?a.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0}):a.toFixed(2);return(n<0?"-":"")+p+f}
function getFiltered(){return DAILY.filter(d=>d.date>=dateFrom.value&&d.date<=dateTo.value)}

function calcSummary(data){
  const r=data.reduce((a,d)=>a+d.revenue,0);
  const o=data.reduce((a,d)=>a+d.orders,0);
  const c=data.reduce((a,d)=>a+calcCOGS(d.solo,d.upsell),0);
  const s=data.reduce((a,d)=>a+d.spend,0);
  const f=r*0.029+o*0.30;
  const pb=r-c-f;
  const pn=r-c-f-s;
  return{revenue:r,orders:o,aov:o>0?r/o:0,cogs:c,profitBeforeAds:pb,metaSpend:s,profitNet:pn,roasBlended:s>0?r/s:0,cpaBlended:o>0?s/o:0,marginNet:r>0?(pn/r)*100:0};
}

function render(){
  const el=document.getElementById("content");
  document.getElementById("dateBar").style.display=currentTab==="settings"?"none":"flex";
  if(currentTab==="settings") renderSettings(el);
  else if(currentTab==="breakdown") renderTable(el,getFiltered());
  else renderKPIs(el,getFiltered());
}

function kpi(l,v,p="$",sx="",c,sm){const neg=typeof v==="number"&&v<0;const col=c||(neg?"var(--red)":"var(--green)");const cls=sm?"kpi sm":"kpi";const dsp=typeof v==="number"?fmt(v,p)+sx:v+sx;return'<div class="'+cls+'"><div class="kpi-label">'+l+'</div><div class="kpi-value" style="color:'+col+'">'+dsp+'</div></div>'}

function renderKPIs(el,data){
  const s=calcSummary(data);
  el.innerHTML='<div class="kpi-row">'+kpi("Revenue",s.revenue,"$","","var(--peach)")+kpi("Commandes",s.orders,"","","var(--white)")+kpi("AOV",s.aov,"$","","var(--teal)")+kpi("COGS",s.cogs,"$","","var(--muted)")+'</div><div class="kpi-row">'+kpi("Profit avant ads",s.profitBeforeAds,"$","","var(--green)")+kpi("Meta Spend",s.metaSpend,"$","","var(--coral)")+kpi("Profit NET",s.profitNet)+kpi("ROAS Blended",s.roasBlended,"","x",s.roasBlended>=1.66?"var(--green)":"var(--red)")+'</div><div class="kpi-row">'+kpi("CPA Blended",s.cpaBlended,"$","","var(--white)",1)+kpi("Marge nette",s.marginNet,"","%",null,1)+kpi("BE ROAS",1.66,"","x","var(--muted)",1)+'</div>';
}

function renderTable(el,data){
  let rows=data.map(r=>{
    const cogs=calcCOGS(r.solo,r.upsell);
    const pn=r.revenue-cogs-(r.revenue*0.029+r.orders*0.30)-r.spend;
    const roas=r.spend>0?(r.revenue/r.spend).toFixed(2):"\u2014";
    const rc=roas!=="\u2014"?(parseFloat(roas)>=1.66?"var(--green)":"var(--red)"):"var(--dimmed)";
    return'<tr><td style="color:var(--peach);font-family:JetBrains Mono,monospace;font-weight:500">'+r.label+'</td><td>'+r.orders+'</td><td style="color:var(--teal)">'+fmt(r.revenue)+'</td><td style="color:var(--muted)">'+fmt(cogs)+'</td><td style="color:var(--coral)">'+fmt(r.spend)+'</td><td style="color:'+(pn>=0?"var(--green)":"var(--red)")+';font-weight:600">'+fmt(pn)+'</td><td style="color:'+rc+'">'+roas+(roas!=="\u2014"?"x":"")+'</td></tr>';
  }).join("");
  const t=data.reduce((a,r)=>{const cogs=calcCOGS(r.solo,r.upsell);const pn=r.revenue-cogs-(r.revenue*0.029+r.orders*0.30)-r.spend;return{orders:a.orders+r.orders,revenue:a.revenue+r.revenue,cogs:a.cogs+cogs,spend:a.spend+r.spend,profitNet:a.profitNet+pn}},{orders:0,revenue:0,cogs:0,spend:0,profitNet:0});
  el.innerHTML='<div class="tbl-box"><table><thead><tr><th>Date</th><th>Cmd</th><th>Revenue</th><th>COGS</th><th>Spend</th><th>Profit Net</th><th>ROAS</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr class="total-row"><td style="color:var(--peach)">TOTAL</td><td>'+t.orders+'</td><td style="color:var(--teal)">'+fmt(t.revenue)+'</td><td style="color:var(--muted)">'+fmt(t.cogs)+'</td><td style="color:var(--coral)">'+fmt(t.spend)+'</td><td style="color:'+(t.profitNet>=0?"var(--green)":"var(--red)")+'">'+fmt(t.profitNet)+'</td><td></td></tr></tfoot></table></div>';
}

function renderSettings(el){
  let rows=ALL_SKUS.map(s=>{
    const c=skuCosts[s.sku]||{solo:s.defaultSolo,upsell:s.defaultUpsell};
    return'<tr><td>'+s.sku+'</td><td>'+s.name+'</td><td><input type="number" step="0.01" min="0" data-sku="'+s.sku+'" data-type="solo" value="'+(c.solo||0).toFixed(2)+'"></td><td><input type="number" step="0.01" min="0" data-sku="'+s.sku+'" data-type="upsell" value="'+(c.upsell||0).toFixed(2)+'"></td></tr>';
  }).join("");
  el.innerHTML='<div class="settings-section"><h3>Co\u00fbt par SKU (COGS)</h3><p style="color:var(--muted);font-size:12px;margin-bottom:16px">D\u00e9finissez le co\u00fbt d\'achat unitaire pour chaque produit.<br><b>Solo</b> = produit principal ou command\u00e9 seul &nbsp;|&nbsp; <b>Upsell</b> = ajout\u00e9 \u00e0 une commande avec des markers</p><table class="settings-table"><thead><tr><th style="text-align:left">SKU</th><th style="text-align:left">Produit</th><th style="text-align:left">Solo ($)</th><th style="text-align:left">Upsell ($)</th></tr></thead><tbody>'+rows+'</tbody></table><div style="display:flex;align-items:center;margin-top:16px"><button class="btn-save" id="btnSave">Sauvegarder</button><span class="save-msg" id="saveMsg">\u2713 Sauvegard\u00e9</span></div></div>';
  document.getElementById("btnSave").addEventListener("click",()=>{
    document.querySelectorAll('.settings-table input[data-sku]').forEach(inp=>{
      const sku=inp.dataset.sku,type=inp.dataset.type;
      if(!skuCosts[sku])skuCosts[sku]={solo:0,upsell:0};
      skuCosts[sku][type]=parseFloat(inp.value)||0;
    });
    saveCosts(skuCosts);
    const msg=document.getElementById("saveMsg");
    msg.classList.add("show");
    setTimeout(()=>msg.classList.remove("show"),2000);
  });
}

dateFrom.addEventListener("change",render);dateTo.addEventListener("change",render);
document.querySelectorAll(".quick-btn").forEach(b=>{b.addEventListener("click",()=>{document.querySelectorAll(".quick-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");const r=b.dataset.range;if(r==="all"){dateFrom.value=DAILY[0].date;dateTo.value=DAILY[DAILY.length-1].date}else{const days=parseInt(r),last=DAILY[DAILY.length-1].date,from=new Date(last);from.setDate(from.getDate()-days+1);dateFrom.value=from.toISOString().split("T")[0];dateTo.value=last}render()})});
document.querySelectorAll(".tab").forEach(b=>{b.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentTab=b.dataset.tab;render()})});
render();
</script>
</body>
</html>
