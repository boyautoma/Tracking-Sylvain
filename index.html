<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VividCraft — P&L Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --coral: #E87461;
  --teal: #2BAA94;
  --peach: #F5B88C;
  --dark: #1a1a2e;
  --dark2: #16213e;
  --dark3: #1e2a4a;
  --white: #f0f0f0;
  --red: #ff6b6b;
  --green: #51cf66;
  --muted: #8892a4;
  --dimmed: #5a6478;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: linear-gradient(135deg, var(--dark) 0%, #0f1628 100%);
  color: var(--white);
  font-family: 'Inter', -apple-system, sans-serif;
  min-height: 100vh;
  padding: 24px 20px;
}
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:28px; flex-wrap:wrap; gap:12px; }
.header h1 { font-size:26px; font-weight:700; letter-spacing:-0.5px; }
.header h1 .coral { color:var(--coral); }
.header h1 .teal { color:var(--teal); }
.header h1 .sub { color:var(--muted); font-weight:400; font-size:16px; margin-left:10px; }
.meta-info { font-size:11px; color:var(--dimmed); font-family:'JetBrains Mono',monospace; margin-top:4px; }
.tabs { display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
.tab {
  background:transparent; color:var(--muted); border:1px solid var(--dark3);
  border-radius:8px; padding:8px 18px; font-size:13px; font-weight:600;
  cursor:pointer; transition:all .2s; font-family:inherit;
}
.tab.active { background:var(--teal); color:var(--dark); border-color:var(--teal); }
.kpi-row { display:flex; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.kpi {
  background:var(--dark2); border-radius:12px; padding:20px 24px;
  border:1px solid var(--dark3); min-width:150px; flex:1;
}
.kpi.sm { padding:14px 16px; min-width:120px; }
.kpi-label {
  font-size:11px; color:var(--muted); text-transform:uppercase;
  letter-spacing:1.2px; margin-bottom:6px; font-family:'JetBrains Mono',monospace;
}
.kpi-value { font-size:28px; font-weight:700; font-family:'Space Mono',monospace; }
.kpi.sm .kpi-value { font-size:20px; }
.chart-box {
  background:var(--dark2); border-radius:12px; padding:20px 16px;
  border:1px solid var(--dark3); margin-bottom:16px;
}
.chart-title { margin:0 0 16px 8px; font-size:14px; color:var(--muted); font-weight:500; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th {
  padding:8px 12px; text-align:right; color:var(--dimmed);
  font-weight:600; font-size:11px; text-transform:uppercase;
  letter-spacing:.5px; border-bottom:2px solid var(--dark3);
}
td { padding:10px 12px; text-align:right; }
tr.total-row { border-top:2px solid rgba(43,170,148,.27); }
tr.total-row td { padding:12px; font-weight:700; }
.footer {
  text-align:center; margin-top:24px; font-size:11px;
  color:#3a4458; font-family:'JetBrains Mono',monospace;
}
.neg { color:var(--red); }
.pos { color:var(--green); }
@media(max-width:600px) {
  .kpi { min-width:calc(50% - 8px); padding:14px 16px; }
  .kpi-value { font-size:20px; }
  .kpi.sm { min-width:calc(33% - 8px); }
  .kpi.sm .kpi-value { font-size:16px; }
  body { padding:16px 12px; }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1><span class="coral">Vivid</span><span class="teal">Craft</span><span class="sub">P&L Dashboard</span></h1>
    <div class="meta-info" id="metaInfo"></div>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div id="content"></div>
<div class="footer">Mis à jour par Claude · Données hébergées sur GitHub Pages</div>

<script>
// ====== DATA (updated by Claude) ======
const DATA = {
  lastUpdated: "2026-04-09T15:00:00",
  period: { start: "2026-03-28", end: "2026-04-09" },
  summary: {
    revenue: 3480.84, orders: 59, aov: 59.00, cogs: 1285.36,
    shopifyFees: 118.64, profitBeforeAds: 2076.84, metaSpend: 2384.22,
    profitNet: -307.38, roasBlended: 1.46, cpaBlended: 40.41,
    marginNet: -8.8, breakevenRoas: 1.66
  },
  daily: [
    {date:"03/28",orders:1,revenue:5.69,cogs:15.01,profit:-9.79,spend:0,profitNet:-9.79},
    {date:"03/29",orders:5,revenue:268.97,cogs:85.88,profit:173.79,spend:134.05,profitNet:39.74},
    {date:"03/30",orders:2,revenue:81.50,cogs:23.28,profit:55.26,spend:179.62,profitNet:-124.36},
    {date:"03/31",orders:1,revenue:49.50,cogs:15.01,profit:32.75,spend:197.14,profitNet:-164.39},
    {date:"04/01",orders:5,revenue:341.96,cogs:127.76,profit:202.78,spend:141.70,profitNet:61.08},
    {date:"04/02",orders:2,revenue:69.98,cogs:16.54,profit:50.81,spend:167.43,profitNet:-116.62},
    {date:"04/03",orders:8,revenue:418.96,cogs:152.57,profit:251.84,spend:207.61,profitNet:44.23},
    {date:"04/04",orders:9,revenue:519.45,cogs:191.89,profit:309.80,spend:197.57,profitNet:112.23},
    {date:"04/05",orders:5,revenue:313.46,cogs:121.02,profit:181.85,spend:284.27,profitNet:-102.42},
    {date:"04/06",orders:7,revenue:438.97,cogs:168.61,profit:255.53,spend:199.77,profitNet:55.76},
    {date:"04/07",orders:6,revenue:420.96,cogs:160.10,profit:246.85,spend:304.73,profitNet:-57.88},
    {date:"04/08",orders:7,revenue:496.45,cogs:192.68,profit:287.27,spend:236.62,profitNet:50.65},
    {date:"04/09",orders:1,revenue:54.99,cogs:15.01,profit:38.09,spend:134.84,profitNet:-96.75}
  ],
  periodSelected: {
    label: "6-9 avril", revenue: 1411.37, orders: 21, aov: 67.21,
    cogs: 536.40, profitBeforeAds: 827.74, metaSpend: 875.96,
    profitNet: -48.22, roasBlended: 1.61, cpaBlended: 41.71, marginNet: -3.4
  }
};
// ====== END DATA ======

let currentTab = "global";
let chart = null;

function fmt(n, prefix="$") {
  if (n==null) return "—";
  const abs = Math.abs(n);
  const f = abs>=1000 ? abs.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0}) : abs.toFixed(2);
  return `${n<0?"-":""}${prefix}${f}`;
}

function init() {
  document.getElementById("metaInfo").textContent =
    `Période: ${DATA.period.start} → ${DATA.period.end} · MAJ: ${new Date(DATA.lastUpdated).toLocaleDateString("fr-FR")}`;

  const tabsDef = [
    {id:"global",label:"Vue globale"},
    {id:"period",label:DATA.periodSelected.label},
    {id:"daily",label:"Jour par jour"}
  ];
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  tabsDef.forEach(t => {
    const btn = document.createElement("button");
    btn.className = "tab" + (t.id===currentTab?" active":"");
    btn.textContent = t.label;
    btn.onclick = () => { currentTab=t.id; init(); };
    tabsEl.appendChild(btn);
  });

  const content = document.getElementById("content");
  if (currentTab==="daily") renderTable(content);
  else renderKPIs(content, currentTab==="period"?DATA.periodSelected:DATA.summary);
}

function kpiHTML(label, value, prefix="$", suffix="", color, small=false) {
  const isNeg = typeof value==="number" && value<0;
  const c = color||(isNeg?"var(--red)":"var(--green)");
  const cls = small?"kpi sm":"kpi";
  const display = typeof value==="number" ? fmt(value,prefix)+suffix : value+suffix;
  return `<div class="${cls}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value" style="color:${c}">${display}</div>
  </div>`;
}

function renderKPIs(el, s) {
  const be = s.breakevenRoas || 1.66;
  el.innerHTML = `
    <div class="kpi-row">
      ${kpiHTML("Revenue",s.revenue,"$","","var(--peach)")}
      ${kpiHTML("Commandes",s.orders,"","","var(--white)")}
      ${kpiHTML("AOV",s.aov,"$","","var(--teal)")}
      ${kpiHTML("COGS",s.cogs,"$","","var(--muted)")}
    </div>
    <div class="kpi-row">
      ${kpiHTML("Profit avant ads",s.profitBeforeAds,"$","","var(--green)")}
      ${kpiHTML("Meta Spend",s.metaSpend,"$","","var(--coral)")}
      ${kpiHTML("Profit NET",s.profitNet)}
      ${kpiHTML("ROAS Blended",s.roasBlended,"","x",s.roasBlended>=1.66?"var(--green)":"var(--red)")}
    </div>
    <div class="kpi-row" style="margin-bottom:28px">
      ${kpiHTML("CPA Blended",s.cpaBlended,"$","","var(--white)",true)}
      ${kpiHTML("Marge nette",s.marginNet,"","%",null,true)}
      ${kpiHTML("BE ROAS",be,"","x","var(--muted)",true)}
    </div>
    <div class="chart-box">
      <h3 class="chart-title">Revenue vs Spend vs Profit Net</h3>
      <canvas id="mainChart" height="280"></canvas>
    </div>`;
  renderChart();
}

function renderChart() {
  if(chart) chart.destroy();
  const ctx = document.getElementById("mainChart");
  if(!ctx) return;
  const d = DATA.daily;
  chart = new Chart(ctx, {
    type:"bar",
    data: {
      labels: d.map(x=>x.date),
      datasets: [
        {type:"bar",label:"Revenue",data:d.map(x=>x.revenue),backgroundColor:"rgba(43,170,148,.7)",borderRadius:4,order:2},
        {type:"bar",label:"Spend",data:d.map(x=>x.spend),backgroundColor:"rgba(232,116,97,.6)",borderRadius:4,order:3},
        {type:"line",label:"Profit Net",data:d.map(x=>x.profitNet),borderColor:"#F5B88C",backgroundColor:"#F5B88C",pointRadius:4,pointBackgroundColor:"#F5B88C",borderWidth:2,tension:.3,order:1}
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      scales: {
        x:{ticks:{color:"#5a6478",font:{size:11}},grid:{color:"rgba(30,42,74,.5)"}},
        y:{ticks:{color:"#5a6478",font:{size:11},callback:v=>"$"+v},grid:{color:"rgba(30,42,74,.5)"}}
      },
      plugins:{
        legend:{labels:{color:"#8892a4",font:{size:11}}},
        tooltip:{
          backgroundColor:"#1a1a2e",borderColor:"#1e2a4a",borderWidth:1,
          titleColor:"#F5B88C",bodyColor:"#f0f0f0",
          callbacks:{label:c=>`${c.dataset.label}: $${c.parsed.y.toFixed(2)}`}
        }
      }
    }
  });
}

function renderTable(el) {
  const d = DATA.daily;
  const totals = d.reduce((a,r)=>({orders:a.orders+r.orders,revenue:a.revenue+r.revenue,cogs:a.cogs+r.cogs,spend:a.spend+r.spend,profitNet:a.profitNet+r.profitNet}),{orders:0,revenue:0,cogs:0,spend:0,profitNet:0});
  let rows = d.map(r=>{
    const roas = r.spend>0?(r.revenue/r.spend).toFixed(2):"—";
    const roasColor = roas!=="—"?(parseFloat(roas)>=1.66?"var(--green)":"var(--red)"):"var(--dimmed)";
    return `<tr>
      <td style="color:var(--peach);font-family:'JetBrains Mono',monospace;font-weight:500">${r.date}</td>
      <td>${r.orders}</td>
      <td style="color:var(--teal)">${fmt(r.revenue)}</td>
      <td style="color:var(--muted)">${fmt(r.cogs)}</td>
      <td style="color:var(--coral)">${fmt(r.spend)}</td>
      <td style="color:${r.profitNet>=0?"var(--green)":"var(--red)"};font-weight:600">${fmt(r.profitNet)}</td>
      <td style="color:${roasColor}">${roas}${roas!=="—"?"x":""}</td>
    </tr>`;
  }).join("");

  el.innerHTML = `<div class="chart-box" style="overflow-x:auto">
    <h3 class="chart-title">Détail journalier</h3>
    <table>
      <thead><tr>${["Date","Cmd","Revenue","COGS","Spend","Profit Net","ROAS"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr class="total-row">
        <td style="color:var(--peach)">TOTAL</td>
        <td>${totals.orders}</td>
        <td style="color:var(--teal)">${fmt(totals.revenue)}</td>
        <td style="color:var(--muted)">${fmt(totals.cogs)}</td>
        <td style="color:var(--coral)">${fmt(totals.spend)}</td>
        <td style="color:${totals.profitNet>=0?"var(--green)":"var(--red)"}">${fmt(totals.profitNet)}</td>
        <td></td>
      </tr></tfoot>
    </table>
  </div>`;
}

init();
</script>
</body>
</html>
