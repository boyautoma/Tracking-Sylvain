<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VividCraft — P&L Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--coral:#E87461;--teal:#2BAA94;--peach:#F5B88C;--dark:#111827;--dark2:#1a2235;--dark3:#243049;--white:#f0f0f0;--red:#ff6b6b;--green:#51cf66;--muted:#8892a4;--dimmed:#5a6478;--sidebar-bg:#0d1117;--sidebar-w:240px;--hover:rgba(43,170,148,.08);--active-bg:rgba(43,170,148,.15)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--dark);color:var(--white);font-family:'Inter',-apple-system,sans-serif}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);border-right:1px solid var(--dark3);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;padding:0;z-index:100}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--dark3);border-radius:4px}
.sb-logo{padding:20px 16px 24px;display:flex;align-items:center;gap:8px}
.sb-logo h1{font-size:16px;font-weight:700;letter-spacing:-0.3px}
.sb-logo .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex-shrink:0}
.sb-section{padding:0 8px;margin-bottom:16px}
.sb-section-label{font-size:10px;font-weight:600;color:var(--dimmed);text-transform:uppercase;letter-spacing:1.5px;padding:0 8px;margin-bottom:4px;font-family:'JetBrains Mono',monospace}
.sb-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;color:var(--muted);text-decoration:none;position:relative}
.sb-item:hover{background:var(--hover);color:var(--white)}
.sb-item.active{background:var(--active-bg);color:var(--teal)}
.sb-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.sb-item.active svg{opacity:1}
.sb-badge{margin-left:auto;background:var(--teal);color:var(--dark);font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;font-family:'JetBrains Mono',monospace}
.sb-badge.coral{background:var(--coral)}
.sb-divider{height:1px;background:var(--dark3);margin:12px 16px}
.sb-footer{margin-top:auto;padding:16px;font-size:10px;color:var(--dimmed);font-family:'JetBrains Mono',monospace;border-top:1px solid var(--dark3)}

/* Mobile hamburger */
.hamburger{display:none;position:fixed;top:14px;left:14px;z-index:200;background:var(--sidebar-bg);border:1px solid var(--dark3);border-radius:8px;padding:8px;cursor:pointer;color:var(--muted)}
.hamburger svg{width:20px;height:20px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}

/* Main content */
.main{flex:1;overflow-y:auto;padding:28px 32px;background:linear-gradient(135deg,var(--dark) 0%,#0f1628 100%);min-height:100vh}
.main-header{margin-bottom:24px}
.main-header h2{font-size:22px;font-weight:700;letter-spacing:-0.3px;margin-bottom:4px}
.main-header p{font-size:12px;color:var(--dimmed);font-family:'JetBrains Mono',monospace}

/* Date bar */
.date-bar{display:flex;align-items:center;gap:10px;margin-bottom:24px;flex-wrap:wrap}
.date-bar label{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px}
.date-bar input[type="date"]{background:var(--dark2);color:var(--white);border:1px solid var(--dark3);border-radius:6px;padding:6px 12px;font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;outline:none}
.date-bar input[type="date"]:focus{border-color:var(--teal)}
.date-bar input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.7);cursor:pointer}
.sep{color:var(--dimmed);font-size:13px}
.quick-btns{display:flex;gap:4px;margin-left:6px}
.quick-btn{background:transparent;color:var(--dimmed);border:1px solid var(--dark3);border-radius:5px;padding:5px 10px;font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace}
.quick-btn:hover,.quick-btn.active{background:var(--teal);color:var(--dark);border-color:var(--teal)}

/* KPIs */
.kpi-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.kpi{background:var(--dark2);border-radius:10px;padding:18px 20px;border:1px solid var(--dark3);min-width:140px;flex:1}
.kpi.sm{padding:12px 14px;min-width:110px}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:5px;font-family:'JetBrains Mono',monospace}
.kpi-value{font-size:26px;font-weight:700;font-family:'Space Mono',monospace}
.kpi.sm .kpi-value{font-size:18px}

/* Table */
.tbl-box{background:var(--dark2);border-radius:10px;padding:16px 14px;border:1px solid var(--dark3);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:7px 10px;text-align:right;color:var(--dimmed);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--dark3)}
td{padding:8px 10px;text-align:right}
tr.total-row{border-top:2px solid rgba(43,170,148,.27)}
tr.total-row td{padding:10px;font-weight:700}

/* Settings */
.settings-section{background:var(--dark2);border-radius:10px;padding:20px;border:1px solid var(--dark3);margin-bottom:16px}
.settings-section h3{font-size:13px;font-weight:700;margin-bottom:14px;color:var(--peach);text-transform:uppercase;letter-spacing:1px;font-family:'JetBrains Mono',monospace}
.settings-table{width:100%;border-collapse:collapse}
.settings-table th{text-align:left;padding:6px 10px;color:var(--dimmed);font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--dark3)}
.settings-table td{padding:7px 10px;border-bottom:1px solid var(--dark3)}
.settings-table td:first-child{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--teal)}
.settings-table td:nth-child(2){color:var(--muted);font-size:11px}
.settings-table input{background:var(--dark);color:var(--white);border:1px solid var(--dark3);border-radius:5px;padding:5px 8px;font-size:12px;font-family:'Space Mono',monospace;width:80px;text-align:right;outline:none}
.settings-table input:focus{border-color:var(--teal)}
.btn-save{background:var(--teal);color:var(--dark);border:none;border-radius:6px;padding:8px 20px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;margin-top:10px}
.btn-save:hover{opacity:.85}
.save-msg{color:var(--green);font-size:11px;margin-left:10px;font-family:'JetBrains Mono',monospace;opacity:0;transition:opacity .3s}
.save-msg.show{opacity:1}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;transition:left .25s;box-shadow:4px 0 24px rgba(0,0,0,.4)}
  .sidebar.open{left:0}
  .hamburger{display:block}
  .overlay.show{display:block}
  .main{padding:56px 16px 20px}
  .kpi{min-width:calc(50% - 8px);padding:14px 14px}
  .kpi-value{font-size:20px}
  .kpi.sm{min-width:calc(50% - 8px)}
  .kpi.sm .kpi-value{font-size:16px}
  .quick-btns{margin-left:0;margin-top:4px}
}
</style>
</head>
<body>

<!-- Login screen -->
<div id="loginScreen" style="display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,var(--dark) 0%,#0f1628 100%)">
  <div style="background:var(--sidebar-bg);border:1px solid var(--dark3);border-radius:12px;padding:40px;width:340px;text-align:center">
    <div style="margin-bottom:24px"><span style="color:var(--coral);font-size:22px;font-weight:700">Vivid</span><span style="color:var(--teal);font-size:22px;font-weight:700">Craft</span><span style="color:var(--muted);font-size:14px;margin-left:8px">P&L</span></div>
    <input type="password" id="loginPwd" placeholder="Mot de passe" style="width:100%;background:var(--dark);color:var(--white);border:1px solid var(--dark3);border-radius:8px;padding:12px 16px;font-size:14px;font-family:inherit;outline:none;margin-bottom:12px;text-align:center" autofocus>
    <div id="loginErr" style="color:var(--red);font-size:12px;margin-bottom:12px;height:16px"></div>
    <button id="loginBtn" style="width:100%;background:var(--teal);color:var(--dark);border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">Connexion</button>
  </div>
</div>

<button class="hamburger" id="hamburger" aria-label="Menu" style="display:none">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
</button>
<div class="overlay" id="overlay"></div>

<div class="app" id="appMain" style="display:none">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="dot"></div>
      <h1><span style="color:var(--coral)">Vivid</span><span style="color:var(--teal)">Craft</span></h1>
    </div>

    <div class="sb-section">
      <div class="sb-section-label">Overview</div>
      <div class="sb-item active" data-view="kpis">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
        <span class="sb-badge" id="badgeOrders"></span>
      </div>
      <div class="sb-item" data-view="breakdown">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 5-6"/></svg>
        Breakdown
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-section-label">Data</div>
      <div class="sb-item" data-view="products">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Produits
        <span class="sb-badge" id="badgeProducts"></span>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-section-label">Settings</div>
      <div class="sb-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        COGS
      </div>
    </div>

    <div class="sb-divider"></div>

    <div class="sb-footer" id="sbFooter"></div>
  </aside>

  <main class="main">
    <div class="main-header" id="mainHeader"></div>
    <div id="dateBar" class="date-bar">
      <label>Du</label><input type="date" id="dateFrom">
      <span class="sep">&rarr;</span>
      <label>Au</label><input type="date" id="dateTo">
      <div class="quick-btns">
        <button class="quick-btn" data-range="3">3J</button>
        <button class="quick-btn" data-range="7">7J</button>
        <button class="quick-btn active" data-range="all">Tout</button>
      </div>
    </div>
    <div id="content"></div>
  </main>
</div>

<script>
let DAILY=[];
let ALL_SKUS=[];
let LAST_UPDATED="";
const LS_KEY="vividcraft_sku_costs_v3";

const DEFAULT_SKUS=[
{sku:"VIVIDCRAFT_ACRYLICMARKER_24COLORS",name:"Acrylic Markers 24 Colors"},
{sku:"VIVIDCRAFT_ACRYLICMARKER_72COLORS",name:"Acrylic Markers 72 Colors"},
{sku:"VIVIDCRAFT_ACRYLICMARKER_168COLORS",name:"Acrylic Markers 168 Colors"},
{sku:"VC_GLITTERMARKER_24",name:"Glitter Markers 24 Colors"},
{sku:"VC_GLITTERMARKER_48",name:"Glitter Markers 48 Colors"},
{sku:"VC_GLITTERMARKER_96",name:"Glitter Markers 96 Colors"},
{sku:"VC_EBOOK",name:"Coloring eBook (digital)"},
{sku:"VC_MIXGUIDE",name:"Digital Color Mixing Guide"},
{sku:"VC_FREESHIP",name:"Free Shipping"},
{sku:"VC_COLORBOOK_JAPAN",name:"Cozy Japan Coloring Book"},
{sku:"VC_COLORBOOK_CORNERS",name:"Little Corners Coloring Book"},
{sku:"VC_ARTBOOK_STEPBYSTEP",name:"Step-by-Step Art Book"}
];

const SKU_NAMES={
  "VIVIDCRAFT_ACRYLICMARKER_24COLORS":"Acrylic Markers 24 Colors",
  "VIVIDCRAFT_ACRYLICMARKER_72COLORS":"Acrylic Markers 72 Colors",
  "VIVIDCRAFT_ACRYLICMARKER_168COLORS":"Acrylic Markers 168 Colors",
  "VC_GLITTERMARKER_24":"Glitter Markers 24 Colors",
  "VC_GLITTERMARKER_48":"Glitter Markers 48 Colors",
  "VC_GLITTERMARKER_96":"Glitter Markers 96 Colors",
  "VC_EBOOK":"Coloring eBook (digital)",
  "VC_MIXGUIDE":"Digital Color Mixing Guide",
  "VC_FREESHIP":"Free Shipping",
  "VC_COLORBOOK_JAPAN":"Cozy Japan Coloring Book",
  "VC_COLORBOOK_CORNERS":"Little Corners Coloring Book",
  "VC_ARTBOOK_STEPBYSTEP":"Step-by-Step Art Book"
};

function loadCosts(){
  try{const s=localStorage.getItem(LS_KEY);if(s)return JSON.parse(s)}catch(e){}
  const d={};ALL_SKUS.forEach(s=>d[s.sku]={product:s.defProd,shipping:s.defShip});return d;
}
function saveCosts(costs){localStorage.setItem(LS_KEY,JSON.stringify(costs))}
let skuCosts=loadCosts();

// COGS per order = sum(product costs * qty) + max(shipping cost among all items)
function calcOrderCOGS(items){
  let prodTotal=0,maxShip=0;
  for(const[sku,qty]of Object.entries(items)){
    const c=skuCosts[sku]||{product:0,shipping:0};
    prodTotal+=qty*(c.product||0);
    const ship=c.shipping||0;
    if(ship>maxShip) maxShip=ship;
  }
  return prodTotal+maxShip;
}
// COGS for a day = sum of COGS per order
function calcDayCOGS(cmds){
  return cmds.reduce((t,order)=>t+calcOrderCOGS(order),0);
}

let currentView="kpis";
const dateFrom=document.getElementById("dateFrom"),dateTo=document.getElementById("dateTo");

async function loadData(){
  document.getElementById("content").innerHTML='<div style="text-align:center;padding:60px;color:var(--muted)"><p style="font-size:14px">Chargement des donn\u00e9es...</p></div>';
  try{
    const res=await fetch('data.json?t='+Date.now());
    if(!res.ok) throw new Error('no data.json');
    const json=await res.json();
    DAILY=json.daily||[];
    LAST_UPDATED=json.lastUpdated||"";
    // Build ALL_SKUS from seen SKUs + defaults
    const skuSet=new Set((json.skusSeen||[]).concat(DEFAULT_SKUS.map(s=>s.sku)));
    ALL_SKUS=[...skuSet].map(sku=>({sku,name:SKU_NAMES[sku]||sku}));
    console.log('Loaded data.json:',DAILY.length,'days');
  }catch(e){
    console.warn('data.json not available, no data loaded',e);
    DAILY=[];
  }
  initDashboard();
}

function initDashboard(){
  if(DAILY.length){
    dateFrom.value=DAILY[0].date;dateTo.value=DAILY[DAILY.length-1].date;
    dateFrom.min=DAILY[0].date;dateFrom.max=DAILY[DAILY.length-1].date;
    dateTo.min=DAILY[0].date;dateTo.max=DAILY[DAILY.length-1].date;
    document.getElementById("badgeOrders").textContent=DAILY[DAILY.length-1].orders;
  } else {
    document.getElementById("badgeOrders").textContent="0";
  }
  document.getElementById("badgeProducts").textContent=ALL_SKUS.length;
  const dateStr=LAST_UPDATED?new Date(LAST_UPDATED).toLocaleDateString("fr-FR",{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):"--";
  document.getElementById("sbFooter").textContent="MAJ: "+dateStr;
  skuCosts=loadCosts();
  render();
}

const viewTitles={kpis:["Dashboard","Vue d'ensemble des KPIs"],breakdown:["Breakdown","D\u00e9tail jour par jour"],products:["Produits","Quantit\u00e9s vendues par SKU"],settings:["COGS","Co\u00fbt d'achat par SKU (solo / upsell)"]};

function fmt(n,p="$"){if(n==null)return"\u2014";const a=Math.abs(n);const f=a>=1000?a.toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:0}):a.toFixed(2);return(n<0?"-":"")+p+f}
function getFiltered(){return DAILY.filter(d=>d.date>=dateFrom.value&&d.date<=dateTo.value)}

function calcSummary(data){
  const r=data.reduce((a,d)=>a+d.revenue,0),o=data.reduce((a,d)=>a+d.orders,0);
  const c=data.reduce((a,d)=>a+calcDayCOGS(d.cmds),0),s=data.reduce((a,d)=>a+d.spend,0);
  const f=r*0.029+o*0.30,pb=r-c-f,pn=r-c-f-s;
  return{revenue:r,orders:o,aov:o>0?r/o:0,cogs:c,profitBeforeAds:pb,metaSpend:s,profitNet:pn,roasBlended:s>0?r/s:0,cpaBlended:o>0?s/o:0,marginNet:r>0?(pn/r)*100:0};
}

function render(){
  const el=document.getElementById("content");
  const hdr=document.getElementById("mainHeader");
  const t=viewTitles[currentView];
  hdr.innerHTML='<h2>'+t[0]+'</h2><p>'+t[1]+'</p>';
  document.getElementById("dateBar").style.display=(currentView==="settings"||currentView==="products")?"none":"flex";
  if(currentView==="settings") renderSettings(el);
  else if(currentView==="products") renderProducts(el);
  else if(currentView==="breakdown") renderTable(el,getFiltered());
  else renderKPIs(el,getFiltered());
}

function kpi(l,v,p="$",sx="",c,sm){const neg=typeof v==="number"&&v<0;const col=c||(neg?"var(--red)":"var(--green)");const cls=sm?"kpi sm":"kpi";const dsp=typeof v==="number"?fmt(v,p)+sx:v+sx;return'<div class="'+cls+'"><div class="kpi-label">'+l+'</div><div class="kpi-value" style="color:'+col+'">'+dsp+'</div></div>'}

function renderKPIs(el,data){
  const s=calcSummary(data);
  el.innerHTML='<div class="kpi-row">'+kpi("Revenue",s.revenue,"$","","var(--peach)")+kpi("Commandes",s.orders,"","","var(--white)")+kpi("AOV",s.aov,"$","","var(--teal)")+kpi("COGS",s.cogs,"$","","var(--muted)")+'</div><div class="kpi-row">'+kpi("Profit avant ads",s.profitBeforeAds,"$","","var(--green)")+kpi("Meta Spend",s.metaSpend,"$","","var(--coral)")+kpi("Profit NET",s.profitNet)+kpi("ROAS Blended",s.roasBlended,"","x",s.roasBlended>=1.66?"var(--green)":"var(--red)")+'</div><div class="kpi-row">'+kpi("CPA Blended",s.cpaBlended,"$","","var(--white)",1)+kpi("Marge nette",s.marginNet,"","%",null,1)+kpi("BE ROAS",1.66,"","x","var(--muted)",1)+'</div>';
}

function renderTable(el,data){
  let rows=data.map(r=>{
    const cogs=calcDayCOGS(r.cmds);
    const pn=r.revenue-cogs-(r.revenue*0.029+r.orders*0.30)-r.spend;
    const roas=r.spend>0?(r.revenue/r.spend).toFixed(2):"\u2014";
    const rc=roas!=="\u2014"?(parseFloat(roas)>=1.66?"var(--green)":"var(--red)"):"var(--dimmed)";
    return'<tr><td style="color:var(--peach);font-family:JetBrains Mono,monospace;font-weight:500">'+r.label+'</td><td>'+r.orders+'</td><td style="color:var(--teal)">'+fmt(r.revenue)+'</td><td style="color:var(--muted)">'+fmt(cogs)+'</td><td style="color:var(--coral)">'+fmt(r.spend)+'</td><td style="color:'+(pn>=0?"var(--green)":"var(--red)")+';font-weight:600">'+fmt(pn)+'</td><td style="color:'+rc+'">'+roas+(roas!=="\u2014"?"x":"")+'</td></tr>';
  }).join("");
  const t=data.reduce((a,r)=>{const cogs=calcDayCOGS(r.cmds);const pn=r.revenue-cogs-(r.revenue*0.029+r.orders*0.30)-r.spend;return{orders:a.orders+r.orders,revenue:a.revenue+r.revenue,cogs:a.cogs+cogs,spend:a.spend+r.spend,profitNet:a.profitNet+pn}},{orders:0,revenue:0,cogs:0,spend:0,profitNet:0});
  el.innerHTML='<div class="tbl-box"><table><thead><tr><th>Date</th><th>Cmd</th><th>Revenue</th><th>COGS</th><th>Spend</th><th>Profit Net</th><th>ROAS</th></tr></thead><tbody>'+rows+'</tbody><tfoot><tr class="total-row"><td style="color:var(--peach)">TOTAL</td><td>'+t.orders+'</td><td style="color:var(--teal)">'+fmt(t.revenue)+'</td><td style="color:var(--muted)">'+fmt(t.cogs)+'</td><td style="color:var(--coral)">'+fmt(t.spend)+'</td><td style="color:'+(t.profitNet>=0?"var(--green)":"var(--red)")+'">'+fmt(t.profitNet)+'</td><td></td></tr></tfoot></table></div>';
}

function renderProducts(el){
  const data=getFiltered().length?getFiltered():DAILY;
  const totals={};
  data.forEach(d=>{
    d.cmds.forEach(order=>{
      for(const[sku,qty]of Object.entries(order)){totals[sku]=(totals[sku]||0)+qty}
    });
  });
  let rows=ALL_SKUS.map(s=>{
    const qty=totals[s.sku]||0;
    const c=skuCosts[s.sku]||{product:0,shipping:0};
    return'<tr><td>'+s.sku+'</td><td>'+s.name+'</td><td style="text-align:right;color:var(--white);font-weight:600">'+qty+'</td><td style="text-align:right;color:var(--muted)">'+fmt(c.product)+'</td><td style="text-align:right;color:var(--muted)">'+fmt(c.shipping)+'</td></tr>';
  }).join("");
  el.innerHTML='<div class="tbl-box"><table><thead><tr><th style="text-align:left">SKU</th><th style="text-align:left">Produit</th><th>Qt\u00e9 vendue</th><th>Co\u00fbt produit</th><th>Co\u00fbt shipping</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function renderSettings(el){
  let rows=ALL_SKUS.map(s=>{
    const c=skuCosts[s.sku]||{product:0,shipping:0};
    return'<tr><td>'+s.sku+'</td><td>'+s.name+'</td><td><input type="number" step="0.01" min="0" data-sku="'+s.sku+'" data-type="product" value="'+(c.product||0).toFixed(2)+'"></td><td><input type="number" step="0.01" min="0" data-sku="'+s.sku+'" data-type="shipping" value="'+(c.shipping||0).toFixed(2)+'"></td></tr>';
  }).join("");
  el.innerHTML='<div class="settings-section"><h3>Co\u00fbt par SKU (COGS)</h3><p style="color:var(--muted);font-size:11px;margin-bottom:14px"><b>Produit</b> = co\u00fbt d\'achat unitaire &nbsp;|&nbsp; <b>Shipping</b> = co\u00fbt d\'exp\u00e9dition unitaire<br>Par commande : somme des co\u00fbts produits + max(shipping) le plus \u00e9lev\u00e9</p><table class="settings-table"><thead><tr><th style="text-align:left">SKU</th><th style="text-align:left">Produit</th><th style="text-align:left">Co\u00fbt ($)</th><th style="text-align:left">Shipping ($)</th></tr></thead><tbody>'+rows+'</tbody></table><div style="display:flex;align-items:center;margin-top:12px"><button class="btn-save" id="btnSave">Sauvegarder</button><span class="save-msg" id="saveMsg">\u2713 Sauvegard\u00e9</span></div></div>';
  document.getElementById("btnSave").addEventListener("click",()=>{
    document.querySelectorAll('.settings-table input[data-sku]').forEach(inp=>{
      const sku=inp.dataset.sku,type=inp.dataset.type;
      if(!skuCosts[sku])skuCosts[sku]={product:0,shipping:0};
      skuCosts[sku][type]=parseFloat(inp.value)||0;
    });
    saveCosts(skuCosts);
    const msg=document.getElementById("saveMsg");
    msg.classList.add("show");
    setTimeout(()=>msg.classList.remove("show"),2000);
  });
}

// Sidebar navigation
document.querySelectorAll(".sb-item[data-view]").forEach(item=>{
  item.addEventListener("click",()=>{

// Date controls
dateFrom.addEventListener("change",render);
dateTo.addEventListener("change",render);
document.querySelectorAll(".quick-btn").forEach(b=>{b.addEventListener("click",()=>{document.querySelectorAll(".quick-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");const r=b.dataset.range;if(r==="all"){dateFrom.value=DAILY[0].date;dateTo.value=DAILY[DAILY.length-1].date}else{const days=parseInt(r),last=DAILY[DAILY.length-1].date,from=new Date(last);from.setDate(from.getDate()-days+1);dateFrom.value=from.toISOString().split("T")[0];dateTo.value=last}render()})});

document.getElementById("hamburger").addEventListener("click",()=>{

});

});

// Auth
const PWD_HASH='a1b2c3';// placeholder
async function sha256(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
const CORRECT_HASH='13c2a9264b5c7bad593cb023ccfa5be9c0f03a15bd4406463828e9f166efd187';

function checkAuth(){
  if(sessionStorage.getItem('vc_auth')==='1'){showApp();return}
  document.getElementById('loginScreen').style.display='flex';
}

async function tryLogin(){
  const pwd=document.getElementById('loginPwd').value;
  const hash=await sha256(pwd);
  if(hash===CORRECT_HASH){
    sessionStorage.setItem('vc_auth','1');
    showApp();
  } else {
    document.getElementById('loginErr').textContent='Mot de passe incorrect';
  }
}

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appMain').style.display='flex';
  loadData();
}

document.getElementById('loginBtn').addEventListener('click',tryLogin);
document.getElementById('loginPwd').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
checkAuth();
</script>
